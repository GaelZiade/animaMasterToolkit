<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Herramienta de mesa para dirigir combates de Ánima Beyond Fantasy.">
  <!-- Acompanan al tema de la aplicacion: sin esto las barras de scroll y los
       controles nativos se dibujan en claro sobre el fondo oscuro. -->
  <meta name="theme-color" content="#F6F1EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14100F" media="(prefers-color-scheme: dark)">
  <title>Anima Master Toolkit v3</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body { background-color: #F6F1EC; }
    @media (prefers-color-scheme: dark) {
      body { background-color: #14100F; }
    }
  </style>
</head>
