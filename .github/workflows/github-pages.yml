name: Publicar en GitHub Pages

# Publica la version web del toolkit en
# https://gaelziade.github.io/animaMasterToolkit/ en cada push a main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicacion a la vez, sin cancelar la que ya esta corriendo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # El sitio no cuelga de la raiz del dominio, sino de una subcarpeta con el
      # nombre del repositorio, asi que hay que decirselo al construir.
      - run: flutter build web --release --base-href /animaMasterToolkit/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
